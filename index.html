<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>NJAs</title>
  <meta name="description" content="NewJeans archive, read one day at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="book">
  <header class="bar">
    <a class="bar-brand" href="#" id="brand">NJAs</a>
    <button class="bar-menu mono" id="toc-btn" type="button" aria-expanded="false" aria-controls="toc" aria-label="目次とメニュー">MENU</button>
  </header>

  <!-- cover -->
  <section class="cover" id="cover">
    <div class="cover-sweep" aria-hidden="true"></div>
    <div class="cover-glow" aria-hidden="true"></div>
    <div class="cover-inner">
      <span class="mono dim cover-span" id="cover-span" aria-live="polite">&nbsp;</span>
      <h1 class="wordmark"><span class="wm-main">NJAs</span><span class="wm-sub"><em>New</em>Jeans Archive</span></h1>
      <p class="catch">知らなかった頃に、戻れる。</p>
      <p class="lede">
        <span class="lede-lead"><span class="nb">あの軌跡を、</span><span class="nb">もう一度いちから辿っていく。</span></span><span class="lede-line">NewJeansの出来事を、一日一ページで。</span><span class="lede-line"><span class="nb">後から起きたことは、</span><span class="nb">その日のページには出てきません。</span></span>
        <span class="lede-en">Retrace the whole journey, from day one.</span>
      </p>
      <div class="cover-actions">
        <button class="btn primary" id="start-btn" type="button">はじめから読む <span class="mono">FROM THE BEGINNING</span></button>
        <button class="btn" id="resume-btn" type="button" hidden>しおりから続ける <span class="mono" id="resume-label"></span></button>
      </div>
    </div>
  </section>

  <!-- page -->
  <main class="page" id="page" hidden></main>

  <nav class="pager" id="pager" hidden>
    <div class="progress" aria-hidden="true"><i id="progress-fill"></i></div>
    <button class="pager-btn prev" id="prev-btn" type="button"><span class="mono">← PREV</span><span class="pager-date" id="prev-date"></span></button>
    <button class="pager-mid" id="pager-mid" type="button" aria-label="目次を開く"><span class="pager-pos mono" id="bar-pos"></span><span class="pager-count mono" id="day-count"></span></button>
    <button class="pager-btn next" id="next-btn" type="button"><span class="mono">NEXT →</span><span class="pager-date" id="next-date"></span></button>
  </nav>

  <!-- table of contents -->
  <aside class="toc" id="toc" hidden>
    <div class="toc-head">
      <span class="toc-title">目次 <span class="mono dim">CONTENTS</span></span>
      <span class="toc-head-tools">
        <span class="fs-ctl" role="group" aria-label="本文の文字サイズ"><button class="theme-btn mono" id="fs-minus" type="button" aria-label="文字を小さく">−</button><span class="fs-val mono" id="fs-val">100%</span><button class="theme-btn mono" id="fs-plus" type="button" aria-label="文字を大きく">＋</button></span>
        <button class="theme-btn mono" id="theme-btn" type="button" aria-label="テーマ切替">◐</button>
        <button class="bar-btn mono" id="toc-close" type="button">CLOSE ✕</button>
      </span>
    </div>
    <div class="toc-lang" role="group" aria-label="表示言語 / Language">
      <span class="toc-lang-label mono">言語 LANGUAGE</span>
      <span class="seg" id="lang-seg">
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
        <button type="button" data-lang="both" aria-pressed="false">併記 JA+EN</button>
      </span>
    </div>
    <div class="toc-search">
      <input id="toc-q" type="search" placeholder="検索 / search" autocomplete="off" spellcheck="false">
      <div class="toc-cats" id="toc-cats" role="group" aria-label="カテゴリ"></div>
      <div class="toc-cats toc-members" id="toc-members" role="group" aria-label="メンバー"></div>
    </div>
    <div class="toc-nav" id="toc-nav"></div>
    <div class="toc-body" id="toc-body"></div>
    <div class="toc-foot mono">
      <a href="#" id="index-link">索引（全期間の一覧）</a>
      <span class="dim">未来を含みます</span>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- index (full list, utility) -->
  <section class="index wrap" id="index" hidden>
    <div class="index-head">
      <h2 class="index-title">索引 <span class="mono dim">INDEX · ALL DATES</span></h2>
      <button class="bar-btn mono" id="index-close" type="button">BACK TO BOOK</button>
    </div>
    <input id="index-q" type="search" class="search" placeholder="検索 / search all" autocomplete="off">
    <div id="index-body"></div>
  </section>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close mono" type="button" aria-label="閉じる">CLOSE ✕</button>
    <figure class="lb-fig">
      <img id="lb-img" alt="">
      <figcaption class="lb-cap">
        <span class="mono dim" id="lb-meta"></span>
        <span class="lb-title" id="lb-title"></span>
        <span class="lb-links mono" id="lb-links"></span>
      </figcaption>
    </figure>
  </div>

  <template id="tpl-item">
    <article class="entry">
      <div class="entry-main">
        <div class="entry-text">
          <div class="meta">
            <span class="cat-tag"><i class="sw"></i><span class="cat-label"></span></span>
            <span class="pill time" hidden></span>
            <span class="pill entity" hidden></span>
            <span class="pill members" hidden></span>
            <span class="pill prec" hidden></span>
            <span class="pill unverified" hidden>UNVERIFIED</span>
          </div>
          <h3 class="t-ja"></h3>
          <p class="t-en"></p>
          <p class="t-orig mono" hidden></p>
          <div class="desc" hidden><p class="s-ja"></p><p class="s-en"></p></div>
          <p class="note mono" hidden></p>
          <div class="links mono"></div>
          <div class="tags mono" hidden></div>
        </div>
        <figure class="thumb" hidden></figure>
      </div>
      <div class="media" hidden></div>
      <div class="assets" hidden></div>
    </article>
  </template>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
