<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>NJAs</title>
  <meta name="description" content="NewJeans archive, read one day at a time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="book">
  <header class="bar">
    <div class="bar-inner">
      <a class="bar-brand" href="#" id="brand">NJAs</a>
      <div class="bar-mid mono" id="bar-pos"></div>
      <div class="bar-right">
        <button class="bar-btn mono" id="toc-btn" type="button" aria-expanded="false" aria-controls="toc">目次 / CONTENTS</button>
        <button class="theme-btn mono" id="theme-btn" type="button" aria-label="テーマ切替">◐</button>
      </div>
    </div>
  </header>

  <!-- cover -->
  <section class="cover" id="cover">
    <div class="cover-inner">
      <span class="mono dim">PRIVATE ARCHIVE</span>
      <h1 class="wordmark"><span class="wm-main">NJAs</span><span class="wm-sub"><em>New</em>Jeans Archive</span></h1>
      <p class="lede">
        公開された順に、1日ずつ読む。そのページの日付より後のことは、まだ誰も知らない。
        <span class="lede-en">Read it one day at a time. Nothing after the page you are on is known yet.</span>
      </p>
      <div class="cover-actions">
        <button class="btn primary" id="start-btn" type="button">はじめから読む <span class="mono">FROM THE BEGINNING</span></button>
        <button class="btn" id="resume-btn" type="button" hidden>しおりから続ける <span class="mono" id="resume-label"></span></button>
      </div>
    </div>
  </section>

  <!-- page -->
  <main class="page" id="page" hidden></main>

  <nav class="pager" id="pager" hidden>
    <button class="pager-btn prev" id="prev-btn" type="button"><span class="mono">← PREV</span><span class="pager-date" id="prev-date"></span></button>
    <button class="pager-btn next" id="next-btn" type="button"><span class="mono">NEXT →</span><span class="pager-date" id="next-date"></span></button>
  </nav>

  <!-- table of contents -->
  <aside class="toc" id="toc" hidden>
    <div class="toc-head">
      <span class="toc-title">目次 <span class="mono dim">CONTENTS</span></span>
      <button class="bar-btn mono" id="toc-close" type="button">CLOSE ✕</button>
    </div>
    <div class="toc-search">
      <input id="toc-q" type="search" placeholder="既読範囲を検索 / search what has happened so far" autocomplete="off" spellcheck="false">
    </div>
    <div class="toc-body" id="toc-body"></div>
    <div class="toc-foot mono">
      <a href="#" id="index-link">索引（全期間の一覧）</a>
      <span class="dim">未来を含みます</span>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- index (full list, utility) -->
  <section class="index wrap" id="index" hidden>
    <div class="index-head">
      <h2 class="index-title">索引 <span class="mono dim">INDEX · ALL DATES</span></h2>
      <button class="bar-btn mono" id="index-close" type="button">BACK TO BOOK</button>
    </div>
    <input id="index-q" type="search" class="search" placeholder="検索 / search all" autocomplete="off">
    <div id="index-body"></div>
  </section>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close mono" type="button" aria-label="閉じる">CLOSE ✕</button>
    <figure class="lb-fig">
      <img id="lb-img" alt="">
      <figcaption class="lb-cap">
        <span class="mono dim" id="lb-meta"></span>
        <span class="lb-title" id="lb-title"></span>
        <span class="lb-links mono" id="lb-links"></span>
      </figcaption>
    </figure>
  </div>

  <template id="tpl-item">
    <article class="entry">
      <div class="entry-main">
        <div class="entry-text">
          <div class="meta">
            <span class="cat-tag"><i class="sw"></i><span class="cat-label"></span></span>
            <span class="pill time" hidden></span>
            <span class="pill entity" hidden></span>
            <span class="pill members" hidden></span>
            <span class="pill prec" hidden></span>
            <span class="pill unverified" hidden>UNVERIFIED</span>
          </div>
          <h3 class="t-ja"></h3>
          <p class="t-en"></p>
          <p class="t-orig mono" hidden></p>
          <div class="desc" hidden><p class="s-ja"></p><p class="s-en"></p></div>
          <p class="note mono" hidden></p>
          <div class="links mono"></div>
          <div class="tags mono" hidden></div>
        </div>
        <figure class="thumb" hidden></figure>
      </div>
      <div class="media" hidden></div>
      <div class="assets" hidden></div>
    </article>
  </template>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
