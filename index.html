<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NJAs</title>
  <meta name="description" content="NewJeans official activity archive, sorted by date.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <h1 class="brand">NJAs <span class="brand-sub">NewJeans Archive</span></h1>
      <div class="stats" id="stats" aria-live="polite"></div>
    </div>
    <div class="wrap controls">
      <input id="q" type="search" class="search" placeholder="検索 / Search (title, summary, tags)" autocomplete="off">
      <div class="chips" id="cat-chips" role="group" aria-label="カテゴリ"></div>
      <div class="row-2">
        <div class="chips" id="entity-chips" role="group" aria-label="名義"></div>
        <label class="toggle"><input type="checkbox" id="only-verified"> 確認済のみ / verified only</label>
        <select id="sort" class="select" aria-label="並び順">
          <option value="desc">新しい順 / newest first</option>
          <option value="asc">古い順 / oldest first</option>
        </select>
      </div>
    </div>
  </header>

  <nav class="wrap yearnav" id="yearnav" aria-label="年ジャンプ"></nav>

  <main class="wrap" id="timeline"></main>

  <footer class="wrap site-footer">
    <p>Private archive. Dates: release=発売/配信, announce=発表, broadcast=放送, publish=発行, post=投稿, sale_start=販売開始, event=開催.</p>
  </footer>

  <template id="tpl-item">
    <article class="item">
      <div class="item-date">
        <span class="d"></span>
        <span class="badge dt"></span>
        <span class="badge prec" hidden></span>
      </div>
      <div class="item-body">
        <div class="item-head">
          <span class="cat"></span>
          <span class="entity" hidden></span>
          <span class="members" hidden></span>
          <span class="unverified" hidden title="未確認 / unverified">未確認</span>
        </div>
        <h3 class="t-ja"></h3>
        <p class="t-en"></p>
        <p class="t-orig" hidden></p>
        <p class="s-ja" hidden></p>
        <p class="s-en" hidden></p>
        <div class="media" hidden></div>
        <div class="assets" hidden></div>
        <p class="note" hidden></p>
        <div class="links"></div>
        <div class="tags" hidden></div>
      </div>
    </article>
  </template>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
